<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mythic Clan League Season 1</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #050505;
    --card:     #0b0b0b;
    --surface:  #111111;
    --accent:   #cc1f1f;
    --white:    #f4f7fb;
    --muted:    #8a8a8a;
    --border:   rgba(255,255,255,0.08);
    --win:      #cc1f1f;
    --lose:     #2a2a2a;
    --tbd:      #1c1c1c;
  }

  body {
    background: var(--bg);
    color: var(--white);
    font-family: 'Arial', sans-serif;
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
  }

  #bg-logo {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 180vw; max-width: 2000px;
    opacity: 0.40;
    pointer-events: none;
    z-index: 0;
    user-select: none;
  }

  .header, .tabs, .page, .last-updated { position: relative; z-index: 1; }

  /* ── Header ── */
  .header {
    background: rgba(0,0,0,0.92);
    border-bottom: 1px solid var(--border);
    padding: 14px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .header-left { display: flex; flex-direction: column; gap: 3px; }
  .header-title { font-size: 20px; font-weight: 900; letter-spacing: 0.04em; color: var(--white); }
  .header-title span { color: var(--accent); }
  .header-subtitle { font-size: 11px; font-weight: 700; letter-spacing: 0.12em; color: var(--muted); text-transform: uppercase; }
  .header-right { display: flex; align-items: center; gap: 8px; }
  .status-dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: #444; display: inline-block; margin-right: 8px;
    transition: background 0.3s;
  }
  .status-dot.live { background: #2ecc71; box-shadow: 0 0 6px #2ecc71; }
  .status-label { font-size: 13px; color: var(--muted); }

  /* ── Tabs ── */
  .tabs {
    display: flex; gap: 4px;
    padding: 16px 32px 0;
    border-bottom: 1px solid var(--border);
  }
  .tab {
    padding: 10px 24px; font-size: 14px; font-weight: 700;
    border: 1px solid transparent; border-bottom: none;
    border-radius: 6px 6px 0 0; cursor: pointer;
    background: transparent; color: var(--muted);
    transition: all 0.2s;
  }
  .tab.active { background: var(--surface); color: var(--white); border-color: var(--border); }
  .tab:hover:not(.active) { color: var(--white); }

  /* ── Content pages ── */
  .page { display: none; padding: 32px; }
  .page.active { display: block; }

  /* ── Groups ── */
  .groups-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 24px;
  }
  .group-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  .group-header {
    background: var(--accent);
    padding: 10px 16px;
    font-weight: 900; font-size: 15px; letter-spacing: 0.05em;
  }
  .group-table { width: 100%; border-collapse: collapse; }
  .group-table th {
    padding: 8px 12px; text-align: left; font-size: 12px;
    color: var(--muted); font-weight: 700; letter-spacing: 0.06em;
    border-bottom: 1px solid var(--border);
  }
  .group-table th.center { text-align: center; }
  .group-table td {
    padding: 10px 12px; font-size: 14px;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }
  .group-table tr:last-child td { border-bottom: none; }
  .group-table tr.qualified td:first-child { color: var(--accent); font-weight: 700; }

  .seed-badge {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 22px; height: 22px; padding: 0 4px;
    border-radius: 4px;
    font-size: 11px; font-weight: 900;
    background: var(--surface); color: var(--muted);
    margin-right: 2px;
  }
  .seed-badge.has-seed { background: rgba(204,31,31,0.18); color: var(--accent); }

  .rank-badge {
    display: inline-block; width: 20px; height: 20px; line-height: 20px;
    text-align: center; border-radius: 50%;
    font-size: 11px; font-weight: 700; margin-right: 8px;
    background: var(--surface); color: var(--muted);
  }
  .rank-badge.top { background: var(--accent); color: #fff; }

  /* ── Team logos ── */
  .team-logo-sm {
    width: 24px; height: 24px; border-radius: 3px;
    object-fit: contain; flex-shrink: 0;
    background: var(--surface);
  }
  .team-logo-sm.hidden { display: none; }
  .team-logo-md {
    width: 28px; height: 28px; border-radius: 3px;
    object-fit: contain; flex-shrink: 0;
    background: var(--surface);
  }
  .team-logo-md.hidden { display: none; }
  .team-cell { display: flex; align-items: center; gap: 6px; }

  /* ── Bracket ── */
  .bracket-scroll { overflow-x: auto; padding-bottom: 16px; }
  .bracket {
    display: flex; gap: 0; align-items: stretch;
    min-width: 900px;
  }

  .round {
    display: flex; flex-direction: column;
    justify-content: space-around;
    flex: 1; min-width: 200px;
    padding: 0 8px;
    position: relative;
  }
  .round-title {
    font-size: 11px; font-weight: 700; letter-spacing: 0.1em;
    color: var(--accent); text-transform: uppercase;
    text-align: center; margin-bottom: 16px; padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }

  .match-card {
    background: #1a1a1a;
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 8px;
    overflow: hidden;
    margin: 6px 0;
    position: relative;
    transition: border-color 0.2s;
  }
  .match-card:hover { border-color: rgba(204,31,31,0.5); }
  .match-card .match-label {
    font-size: 10px; color: #aaa; font-weight: 700;
    letter-spacing: 0.08em; padding: 5px 10px 0;
    text-transform: uppercase;
  }

  .team-row {
    display: flex; align-items: center;
    padding: 9px 10px; gap: 6px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    transition: background 0.15s;
  }
  .team-row:last-of-type { border-bottom: none; }
  .team-row.winner { background: rgba(204,31,31,0.12); }
  .team-row.loser  { opacity: 0.45; }
  .team-row.tbd    { opacity: 0.35; }

  .bracket-seed {
    font-size: 10px; font-weight: 900;
    color: var(--accent);
    min-width: 16px; text-align: center;
    opacity: 0.85;
    flex-shrink: 0;
  }
  .bracket-seed:empty { display: none; }

  .team-name {
    flex: 1; font-size: 13px; font-weight: 700;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .team-score {
    font-size: 16px; font-weight: 900; min-width: 24px;
    text-align: right; color: var(--white);
  }
  .team-row.winner .team-score { color: var(--accent); }

  .round.grand-final .match-card {
    border-color: var(--accent);
    box-shadow: 0 0 16px rgba(204,31,31,0.15);
  }

  .bracket-section-label {
    font-size: 12px; font-weight: 700; letter-spacing: 0.08em;
    color: var(--muted); text-transform: uppercase;
    padding: 12px 0 6px;
  }

  /* ── Loading ── */
  .loading {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; min-height: 300px; gap: 16px;
    color: var(--muted);
  }
  .spinner {
    width: 36px; height: 36px; border: 3px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .error-box {
    background: rgba(204,31,31,0.08); border: 1px solid rgba(204,31,31,0.3);
    border-radius: 8px; padding: 20px 24px; margin: 24px 0;
    font-size: 14px; line-height: 1.6; color: var(--muted);
  }
  .error-box strong { color: var(--accent); display: block; margin-bottom: 6px; }

  .last-updated {
    font-size: 12px; color: var(--muted); text-align: right;
    padding: 12px 32px 24px;
  }

  /* ── Upcoming Games ── */
  .upcoming-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 20px;
  }
  .upcoming-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    transition: border-color 0.2s, transform 0.2s;
  }
  .upcoming-card:hover { border-color: rgba(204,31,31,0.45); transform: translateY(-2px); }
  .upcoming-card-banner {
    width: 100%; height: 160px; object-fit: cover;
    display: block; background: var(--surface);
  }
  .upcoming-card-banner-placeholder {
    width: 100%; height: 160px;
    background: linear-gradient(135deg, #0f0f0f 0%, #1a1a1a 100%);
    display: flex; align-items: center; justify-content: center;
  }
  .upcoming-card-banner-placeholder svg { opacity: 0.18; }
  .upcoming-card-body { padding: 16px 18px 18px; }
  .upcoming-card-date {
    font-size: 11px; font-weight: 700; letter-spacing: 0.12em;
    color: var(--accent); text-transform: uppercase; margin-bottom: 8px;
  }
  .upcoming-card-title {
    font-size: 17px; font-weight: 900; color: var(--white);
    line-height: 1.25; margin-bottom: 8px;
  }
  .upcoming-card-matchup {
    display: flex; align-items: center; gap: 8px;
    margin: 10px 0;
  }
  .upcoming-card-team {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    flex: 1;
  }
  .upcoming-card-team-logo {
    width: 40px; height: 40px; object-fit: contain;
    border-radius: 4px; background: var(--surface);
  }
  .upcoming-card-team-name {
    font-size: 12px; font-weight: 700; color: var(--white);
    text-align: center; line-height: 1.2;
  }
  .upcoming-vs {
    font-size: 13px; font-weight: 900; color: var(--muted);
    flex-shrink: 0;
  }
  .upcoming-card-desc {
    font-size: 13px; color: var(--muted); line-height: 1.6;
    margin-top: 10px; border-top: 1px solid var(--border); padding-top: 10px;
  }
  .upcoming-empty {
    text-align: center; padding: 60px 0;
    color: var(--muted); font-size: 15px;
  }
  .upcoming-empty svg { opacity: 0.2; display: block; margin: 0 auto 16px; }

  /* ── Timezone selector ── */
  .tz-bar {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 20px; flex-wrap: wrap;
  }
  .tz-label { font-size: 13px; color: var(--muted); }
  .tz-select {
    background: var(--surface); color: var(--white);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 7px 12px; font-size: 13px; outline: none; cursor: pointer;
  }
  .tz-select:focus { border-color: rgba(204,31,31,0.5); }

  /* ── Scheduling tab ── */
  .sched-login {
    max-width: 420px; margin: 60px auto; text-align: center;
  }
  .sched-login h2 { font-size: 22px; font-weight: 900; margin-bottom: 8px; }
  .sched-login p { color: var(--muted); font-size: 13px; margin-bottom: 24px; }
  .sched-input {
    width: 100%; background: var(--surface); color: var(--white);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 12px 16px; font-size: 15px; outline: none;
    margin-bottom: 12px; text-align: center; letter-spacing: 0.15em;
    text-transform: uppercase;
  }
  .sched-input:focus { border-color: rgba(204,31,31,0.6); }
  .sched-btn {
    width: 100%; background: var(--accent); color: white; border: none;
    border-radius: 8px; padding: 12px; font-size: 14px; font-weight: 700;
    cursor: pointer; transition: background 0.2s;
  }
  .sched-btn:hover { background: #e02222; }
  .sched-error { color: var(--accent); font-size: 13px; margin-top: 8px; }

  .sched-header {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 20px; flex-wrap: wrap;
  }
  .sched-team-badge {
    background: rgba(204,31,31,0.15); color: var(--accent);
    border: 1px solid rgba(204,31,31,0.3); border-radius: 8px;
    padding: 6px 14px; font-size: 13px; font-weight: 900;
    letter-spacing: 0.04em;
  }
  .sched-logout {
    background: transparent; color: var(--muted); border: 1px solid var(--border);
    border-radius: 6px; padding: 5px 12px; font-size: 12px; cursor: pointer;
  }
  .sched-logout:hover { color: var(--white); }

  .sched-matchup-select {
    background: var(--surface); color: var(--white);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 14px; font-size: 13px; outline: none; cursor: pointer;
    margin-left: auto;
  }

  /* Calendar */
  .sched-cal-wrap { overflow-x: auto; }
  .sched-cal {
    min-width: 700px; border-collapse: collapse; width: 100%;
    font-size: 12px;
  }
  .sched-cal th {
    padding: 8px 4px; text-align: center;
    color: var(--muted); font-size: 11px; font-weight: 700;
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; background: var(--bg); z-index: 2;
  }
  .sched-cal td {
    padding: 0; border: 1px solid rgba(255,255,255,0.04);
    vertical-align: top; min-width: 90px;
  }
  .sched-time-label {
    padding: 4px 8px; color: var(--muted); font-size: 11px;
    white-space: nowrap; text-align: right; width: 56px;
    vertical-align: middle; border-right: 1px solid var(--border);
  }
  .sched-slot {
    height: 28px; cursor: pointer;
    transition: background 0.1s;
    position: relative;
  }
  .sched-slot:hover { filter: brightness(1.3); }
  .sched-slot.mine      { background: rgba(204,31,31,0.45); }
  .sched-slot.theirs    { background: rgba(74,158,255,0.35); }
  .sched-slot.overlap   { background: rgba(46,204,113,0.55); }
  .sched-slot.confirmed { background: rgba(255,165,0,0.6); }
  .sched-slot.empty     { background: transparent; }

  .sched-legend {
    display: flex; gap: 16px; flex-wrap: wrap;
    margin-bottom: 14px; font-size: 12px; align-items: center;
  }
  .sched-legend-item { display: flex; align-items: center; gap: 6px; color: var(--muted); }
  .sched-legend-dot {
    width: 14px; height: 14px; border-radius: 3px; flex-shrink: 0;
  }

  .sched-week-nav {
    display: flex; align-items: center; gap: 10px; margin-bottom: 14px;
  }
  .sched-week-nav button {
    background: var(--surface); color: var(--white);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 6px 14px; font-size: 13px; cursor: pointer;
  }
  .sched-week-nav button:hover { border-color: var(--accent); }
  .sched-week-label { font-size: 14px; font-weight: 700; color: var(--white); }

  .sched-overlap-list {
    margin-top: 20px;
  }
  .sched-overlap-list h3 {
    font-size: 14px; font-weight: 900; color: var(--white);
    margin-bottom: 10px; letter-spacing: 0.04em;
  }
  .sched-overlap-item {
    display: flex; align-items: center; gap: 10px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 16px; margin-bottom: 8px;
  }
  .sched-overlap-time { font-size: 13px; font-weight: 700; color: #2ecc71; flex: 1; }
  .sched-confirm-btn {
    background: rgba(46,204,113,0.15); color: #2ecc71;
    border: 1px solid rgba(46,204,113,0.4); border-radius: 6px;
    padding: 5px 14px; font-size: 12px; font-weight: 700; cursor: pointer;
  }
  .sched-confirm-btn:hover { background: rgba(46,204,113,0.25); }
  .sched-confirm-btn.confirmed {
    background: rgba(255,165,0,0.15); color: #ffa500;
    border-color: rgba(255,165,0,0.4);
  }

  .sched-audit {
    margin-top: 20px; background: var(--card);
    border: 1px solid var(--border); border-radius: 10px; padding: 16px;
  }
  .sched-audit h3 { font-size: 13px; font-weight: 900; color: var(--accent);
    letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 10px; }
  .sched-audit-entry {
    font-size: 12px; color: var(--muted); padding: 4px 0;
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }
  .sched-audit-entry:last-child { border-bottom: none; }
  .sched-audit-team { color: var(--white); font-weight: 700; }
  .tz-local-btn {
    background: transparent; color: var(--muted);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 7px 12px; font-size: 12px; cursor: pointer;
  }
  .tz-local-btn:hover { color: var(--white); border-color: rgba(255,255,255,0.2); }

  /* ── Player hover tooltip ── */
  .player-tooltip {
    position: fixed;
    z-index: 9999;
    background: #0f0f0f;
    border: 1px solid rgba(204,31,31,0.6);
    border-radius: 12px;
    padding: 14px 16px;
    min-width: 220px;
    max-width: 300px;
    opacity: 0;
    pointer-events: none;
    transform: scale(0.96);
    transition: opacity 0.15s, transform 0.15s;
    box-shadow: 0 12px 40px rgba(0,0,0,0.85);
  }
  .player-tooltip.visible {
    opacity: 1;
    pointer-events: auto;
    transform: scale(1);
  }
  .tooltip-header {
    font-size: 10px; font-weight: 900; letter-spacing: 0.1em;
    color: var(--accent); text-transform: uppercase;
    margin-bottom: 8px; padding-bottom: 6px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    display: flex; align-items: center; justify-content: space-between;
  }
  .tooltip-close {
    cursor: pointer; color: var(--muted); font-size: 14px; line-height: 1;
    padding: 0 2px;
  }
  .tooltip-close:hover { color: var(--white); }
  .tooltip-player {
    display: grid;
    grid-template-columns: 1fr auto auto;
    align-items: center;
    padding: 4px 0;
    gap: 6px;
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }
  .tooltip-player:last-child { border-bottom: none; }
  .tooltip-player-name {
    font-size: 12px; font-weight: 700;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .tooltip-elig {
    font-size: 10px; color: var(--muted);
    white-space: nowrap; flex-shrink: 0;
  }
  .tooltip-player a {
    font-size: 10px; color: #4a9eff; text-decoration: none; flex-shrink: 0;
    padding: 2px 4px;
  }
  .tooltip-player a:hover { text-decoration: underline; color: #7ab8ff; }
  .tooltip-col-headers {
    display: grid; grid-template-columns: 1fr auto auto;
    gap: 6px; padding: 0 0 4px;
    border-bottom: 1px solid rgba(255,255,255,0.10);
    margin-bottom: 4px;
  }
  .tooltip-col-headers span {
    font-size: 9px; font-weight: 900; letter-spacing: 0.08em;
    color: var(--muted); text-transform: uppercase;
  }
  .team-name-clickable {
    cursor: pointer;
    text-decoration: underline dotted rgba(204,31,31,0.5);
    text-underline-offset: 3px;
    transition: color 0.15s;
    display: inline;
  }
  .team-name-clickable:hover { color: var(--accent); }

  /* ── Team Management tab ── */
  .tm-table-wrap { overflow-x: auto; }
  .tm-table {
    width: 100%; border-collapse: collapse;
    font-size: 13px;
  }
  .tm-table th {
    padding: 10px 14px; text-align: left;
    font-size: 11px; font-weight: 900; letter-spacing: 0.08em;
    color: var(--accent); text-transform: uppercase;
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; background: var(--bg); z-index: 2;
  }
  .tm-table td {
    padding: 9px 14px; border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }
  .tm-table tr:hover td { background: rgba(255,255,255,0.02); }
  .tm-table .captain-row td:first-child { color: var(--accent); font-weight: 700; }
  .tm-table a { color: #4a9eff; text-decoration: none; font-size: 12px; }
  .tm-table a:hover { text-decoration: underline; }
  .tm-clan-tag {
    display: inline-block; background: rgba(204,31,31,0.15);
    color: var(--accent); border-radius: 4px; padding: 2px 7px;
    font-size: 11px; font-weight: 900; letter-spacing: 0.04em;
  }
  .tm-search {
    background: var(--surface); color: var(--white);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 14px; font-size: 13px; width: 280px;
    outline: none;
  }
  .tm-search:focus { border-color: rgba(204,31,31,0.5); }

  /* ── Stats & Recs ── */
  .stats-table-wrap { overflow-x: auto; }
  .stats-table {
    width: 100%; border-collapse: collapse; font-size: 13px;
  }
  .stats-table th {
    padding: 10px 14px; text-align: left;
    font-size: 11px; font-weight: 900; letter-spacing: 0.08em;
    color: var(--accent); text-transform: uppercase;
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; background: var(--bg); z-index: 2;
  }
  .stats-table td {
    padding: 9px 14px; border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }
  .stats-table tr:hover td { background: rgba(255,255,255,0.02); }
  .stats-table .score-cell { font-weight: 900; color: var(--white); }
  .stats-dl-btn {
    display: inline-flex; align-items: center; gap: 5px;
    background: rgba(46,204,113,0.12); color: #2ecc71;
    border: 1px solid rgba(46,204,113,0.3); border-radius: 5px;

<body>

<script type="module">
  import { initializeApp }              from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBxXo4fibhtI5cU7ozHETq_hPPya32FlSE",
    authDomain: "bracket-4b8cc.firebaseapp.com",
    databaseURL: "https://bracket-4b8cc-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "bracket-4b8cc",
    storageBucket: "bracket-4b8cc.firebasestorage.app",
    messagingSenderId: "671390867584",
    appId: "1:671390867584:web:c49a6f97076f98edb8c665"
  };

  const app      = initializeApp(firebaseConfig);
  const database = getDatabase(app);

  // ── Logo helpers ──
  function slugify(name) {
    return name.toLowerCase().trim()
      .replace(/\s+[a-z]$/i, '')
      .replace(/\s+\d+$/, '')
      .replace(/\s+/g, '_')
      .replace(/[^a-z0-9_]/g, '');
  }
  function logoImg(teamName, cssClass) {
    if (!teamName || teamName === 'TBD') return '';
    const slug = slugify(teamName);
    return `<img class="${cssClass}" src="Logos/${slug}.png" alt="${teamName}" data-jpg="Logos/${slug}.jpg" onerror="handleLogoError(this)">`;
  }

  // ── Live listener ──
  const tournamentRef = ref(database, 'tournament');
  onValue(tournamentRef, (snapshot) => {
    const data = snapshot.val();
    if (!data) {
      showError("No tournament data found in Firebase yet. Push from your Python app first.");
      return;
    }
    setStatus(true);
    renderGroups(data.groups   || {}, data.settings || {});
    renderBracket(data.matches || {});
    renderUpcoming(data.upcoming || []);
    renderRoster(data.roster   || {});
    renderStats(data.game_records || []);
    schedUpdateData({
      team_codes:      data.team_codes      || {},
      admin_code:      data.admin_code      || '',
      availability:    data.availability    || {},
      scheduled_games: data.scheduled_games || {},
      game_records:    data.game_records    || [],
      groups:          data.groups          || {},
      audit_log:       data.audit_log       || {},
      upcoming:        data.upcoming        || [],
    });
    document.getElementById('last-updated').textContent =
      'Last updated: ' + new Date().toLocaleTimeString();
  }, (error) => {
    setStatus(false);
    showError("Firebase error: " + error.message);
  });

  function setStatus(live) {
    const dot   = document.getElementById('dot');
    const label = document.getElementById('status-label');
    dot.className     = 'status-dot' + (live ? ' live' : '');
    label.textContent = live ? 'Live' : 'Disconnected';
  }

  function showError(msg) {
    ['bracket', 'groups'].forEach(tab => {
      document.getElementById(tab + '-loading').style.display = 'none';
      document.getElementById(tab + '-content').style.display = 'none';
    });
    const box = document.getElementById('bracket-content');
    box.style.display = 'block';
    box.innerHTML = `<div class="error-box"><strong>Could not load data</strong>${msg}</div>`;
  }

  // ══════════════════════════════════════════════════
  //  BRACKET RENDERER
  // ══════════════════════════════════════════════════
  function buildSeedMap(groups) {
    const map = {};
    Object.values(groups).forEach(teams => {
      (teams || []).forEach(t => {
        if (t.name && t.seed) map[t.name] = t.seed;
      });
    });
    return map;
  }

  let _seedMap = {};

  function renderBracket(matches) {
    const loading = document.getElementById('bracket-loading');
    const content = document.getElementById('bracket-content');
    loading.style.display = 'none';
    content.style.display = 'block';

    const rounds = [
      { label: 'Quarter Finals', ids: ['UB1','UB2','UB3','UB4'] },
      { label: 'Semi Finals',    ids: ['UB5','UB6'] },
      { label: 'Finals',         ids: ['UB7'] },
      { label: 'Quarter Finals', ids: ['LB1','LB2'] },
      { label: 'Semi Finals',    ids: ['LB3','LB4'] },
      { label: 'Finals',         ids: ['LB5'] },
      { label: 'Grand Final',    ids: ['GF'], gf: true },
    ];

    const upper = rounds.slice(0, 3);
    const lower = rounds.slice(3, 6);
    const grand = rounds.slice(6);

    let html = `<div class="bracket-section-label">Upper Bracket</div>
    <div class="bracket-scroll"><div class="bracket">`;
    upper.forEach(r => { html += renderRound(r, matches); });
    html += `</div></div>`;

    html += `<div class="bracket-section-label" style="margin-top:32px">Lower Bracket</div>
    <div class="bracket-scroll"><div class="bracket">`;
    lower.forEach(r => { html += renderRound(r, matches); });
    html += `</div></div>`;

    html += `<div class="bracket-section-label" style="margin-top:32px">Grand Final</div>
    <div class="bracket-scroll"><div class="bracket">`;
    grand.forEach(r => { html += renderRound(r, matches); });
    html += `</div></div>`;

    content.innerHTML = html;
    attachHoverListeners();
  }

  function renderRound(round, matches) {
    let inner = '';
    round.ids.forEach(id => {
      const m = matches[id];
      if (!m) return;
      inner += renderMatch(m);
    });
    return `<div class="round${round.gf ? ' grand-final' : ''}">
      <div class="round-title">${round.label}</div>
      ${inner}
    </div>`;
  }

  function renderMatch(m) {
    const t1Class = rowClass(m, 1);
    const t2Class = rowClass(m, 2);
    const t1 = m.team1 || 'TBD';
    const t2 = m.team2 || 'TBD';
    const s1 = (t1 === 'TBD') ? '' : m.score1;
    const s2 = (t2 === 'TBD') ? '' : m.score2;
    const seed1 = (t1 !== 'TBD' && _seedMap[t1]) ? _seedMap[t1] : '';
    const seed2 = (t2 !== 'TBD' && _seedMap[t2]) ? _seedMap[t2] : '';

    return `<div class="match-card">
      <div class="match-label">${m.label || m.id}</div>
      <div class="team-row ${t1Class}">
        <span class="bracket-seed">${seed1}</span>
        ${logoImg(t1, 'team-logo-md')}
        <span class="team-name">${t1}</span>
        <span class="team-score">${s1}</span>
      </div>
      <div class="team-row ${t2Class}">
        <span class="bracket-seed">${seed2}</span>
        ${logoImg(t2, 'team-logo-md')}
        <span class="team-name">${t2}</span>
        <span class="team-score">${s2}</span>
      </div>
    </div>`;
  }

  function rowClass(m, side) {
    const name = side === 1 ? m.team1 : m.team2;
    if (!name || name === 'TBD') return 'tbd';
    if (m.winner === side) return 'winner';
    if (m.winner && m.winner !== side) return 'loser';
    return '';
  }

  // ══════════════════════════════════════════════════
  //  GROUPS RENDERER
  // ══════════════════════════════════════════════════
  function renderGroups(groups, settings) {
    const loading = document.getElementById('groups-loading');
    const content = document.getElementById('groups-content');
    loading.style.display = 'none';
    content.style.display = 'block';

    _seedMap = buildSeedMap(groups);

    const groupNames = Object.keys(groups).sort();
    if (!groupNames.length) {
      content.innerHTML = '<p style="color:var(--muted)">No group data yet.</p>';
      return;
    }

    let html = '<div class="groups-grid">';
    groupNames.forEach(gName => {
      const teams = groups[gName];
      if (!teams || !teams.length) return;

      const _placeholder = /^[A-D] Team \d+$/;
      const hasScores = teams.some(t => t.wins || t.losses || t.pts);
      const sorted = hasScores
        ? [...teams].sort((a, b) => {
            const aP = !a.name || _placeholder.test(a.name.trim()) ? 1 : 0;
            const bP = !b.name || _placeholder.test(b.name.trim()) ? 1 : 0;
            if (aP !== bP) return aP - bP;
            return (b.pts - a.pts)
              || ((b.wins - b.losses) - (a.wins - a.losses))
              || (b.wins - a.wins)
              || a.name.localeCompare(b.name);
          })
        : [...teams];

      html += `<div class="group-card">
        <div class="group-header">Group ${gName}</div>
        <table class="group-table">
          <thead><tr>
            <th style="width:36px" class="center">Seed</th>
            <th>Team</th>
            <th class="center">W</th>
            <th class="center">L</th>
            <th class="center">Pts</th>
          </tr></thead>
          <tbody>`;

      sorted.forEach((team, i) => {
        const isPlaceholder = !team.name || _placeholder.test(team.name.trim());
        const qualified = i < 2 && !isPlaceholder;
        const seedNum   = team.seed || 0;
        const seedLabel = seedNum ? seedNum : '';
        const seedClass = seedNum ? 'seed-badge has-seed' : 'seed-badge';
        html += `<tr class="${qualified ? 'qualified' : ''}">
          <td style="text-align:center"><span class="${seedClass}">${seedLabel}</span></td>
          <td>
            <div class="team-cell">
              <span class="rank-badge${qualified ? ' top' : ''}">${i + 1}</span>
              ${logoImg(team.name, 'team-logo-sm')}
              <span class="team-name" style="font-size:14px">${team.name}</span>
            </div>
          </td>
          <td style="text-align:center">${team.wins ?? 0}</td>
          <td style="text-align:center">${team.losses ?? 0}</td>
          <td style="text-align:center;color:var(--accent);font-weight:900">${team.pts ?? 0}</td>
        </tr>`;
      });

      html += `</tbody></table></div>`;
    });
    html += '</div>';
    content.innerHTML = html;
    attachHoverListeners();
  }

  // ══════════════════════════════════════════════════
  //  TIMEZONE CONVERSION
  // ══════════════════════════════════════════════════
  let _upcomingItems = [];   // raw items cached for re-render on tz change
  let _selectedTz = Intl.DateTimeFormat().resolvedOptions().timeZone;  // default: user's local tz

  const TIMEZONES = [
    { label: 'GMT (UTC+0)',         value: 'Etc/GMT' },
    { label: 'CET (UTC+1)',         value: 'Europe/Paris' },
    { label: 'EET (UTC+2)',         value: 'Europe/Helsinki' },
    { label: 'MSK (UTC+3)',         value: 'Europe/Moscow' },
    { label: 'GST (UTC+4)',         value: 'Asia/Dubai' },
    { label: 'IST (UTC+5:30)',      value: 'Asia/Kolkata' },
    { label: 'CST China (UTC+8)',   value: 'Asia/Shanghai' },
    { label: 'JST (UTC+9)',         value: 'Asia/Tokyo' },
    { label: 'AEST (UTC+10)',       value: 'Australia/Sydney' },
    { label: 'EST (UTC-5)',         value: 'America/New_York' },
    { label: 'CST (UTC-6)',         value: 'America/Chicago' },
    { label: 'MST (UTC-7)',         value: 'America/Denver' },
    { label: 'PDT (UTC-7)',         value: 'America/Los_Angeles' },
    { label: 'BRT (UTC-3)',         value: 'America/Sao_Paulo' },
  ];

  function parseGmtDate(dateStr) {
    /**
     * Parse strings like:
     *   "Sunday 12 Apr · 18:00 GMT"
     *   "Fri 10 Apr · 00:30 GMT"
     *   "Saturday 11-Apr · 16:00 GMT"
     * Returns a Date object (UTC) or null if unparseable.
     */
    if (!dateStr) return null;
    // Extract time HH:MM
    const timeMatch = dateStr.match(/(\d{1,2}):(\d{2})\s*GMT/i);
    if (!timeMatch) return null;
    const hh = parseInt(timeMatch[1]);
    const mm = parseInt(timeMatch[2]);

    // Extract day number and month abbreviation
    const dayMatch  = dateStr.match(/(\d{1,2})[\s\-]*(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)/i);
    if (!dayMatch) return null;
    const day = parseInt(dayMatch[1]);
    const mon = dayMatch[2];

    // Use current year (or next year if date appears to be past)
    const months = { jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11 };
    const month = months[mon.toLowerCase()];
    if (month === undefined) return null;

    const now = new Date();
    let year = now.getFullYear();
    const candidate = new Date(Date.UTC(year, month, day, hh, mm));
    // If more than 2 months in the past, try next year
    if (candidate < new Date(now - 60 * 24 * 3600 * 1000)) {
      candidate.setUTCFullYear(year + 1);
    }
    return candidate;
  }

  function formatInTz(dateUtc, tz) {
    try {
      return new Intl.DateTimeFormat('en-GB', {
        timeZone: tz,
        weekday: 'short',
        day: 'numeric',
        month: 'short',
        hour: '2-digit',
        minute: '2-digit',
        hour12: false,
      }).format(dateUtc);
    } catch (e) {
      return null;
    }
  }

  function convertDateStr(dateStr, tz) {
    const d = parseGmtDate(dateStr);
    if (!d) return dateStr;   // unparseable — return as-is
    const converted = formatInTz(d, tz);
    if (!converted) return dateStr;
    // Append tz abbreviation
    let tzAbbr = tz;
    try {
      tzAbbr = new Intl.DateTimeFormat('en', { timeZone: tz, timeZoneName: 'short' })
        .formatToParts(d).find(p => p.type === 'timeZoneName')?.value || tz;
    } catch (e) {}
    return `${converted} ${tzAbbr}`;
  }

  // ══════════════════════════════════════════════════
  //  UPCOMING GAMES RENDERER
  // ══════════════════════════════════════════════════
  function renderUpcoming(upcoming) {
    const loading = document.getElementById('upcoming-loading');
    const content = document.getElementById('upcoming-content');
    loading.style.display = 'none';
    content.style.display = 'block';

    _upcomingItems = Array.isArray(upcoming) ? upcoming : Object.values(upcoming);
    _renderUpcomingCards();
  }

  function _renderUpcomingCards() {
    const content = document.getElementById('upcoming-content');
    const items   = _upcomingItems;

    // Build tz selector options
    const localTz = Intl.DateTimeFormat().resolvedOptions().timeZone;
    const localLabel = (() => {
      try {
        const abbr = new Intl.DateTimeFormat('en', { timeZone: localTz, timeZoneName: 'short' })
          .formatToParts(new Date()).find(p => p.type === 'timeZoneName')?.value;
        return `My Timezone (${abbr})`;
      } catch { return 'My Timezone'; }
    })();

    const tzOptions = TIMEZONES.map(tz =>
      `<option value="${tz.value}" ${_selectedTz === tz.value ? 'selected' : ''}>${tz.label}</option>`
    ).join('');

    let html = `<div class="tz-bar">
      <span class="tz-label">🕐 Show times in:</span>
      <select class="tz-select" id="tz-select" onchange="onTzChange(this.value)">
        <option value="${localTz}" ${_selectedTz === localTz ? 'selected' : ''}>${localLabel}</option>
        ${tzOptions}
      </select>
      <button class="tz-local-btn" onclick="onTzChange('${localTz}')">Reset to local</button>
    </div>`;

    if (!items.length) {
      html += `<div class="upcoming-empty">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/>
          <line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
        </svg>
        No upcoming games scheduled yet.
      </div>`;
      content.innerHTML = html;
      return;
    }

    const calIcon = `<svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.2">
      <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/>
      <line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
    </svg>`;

    html += '<div class="upcoming-grid">';
    items.forEach(game => {
      if (!game) return;
      const { title='', date='', team1='', team2='', description='', image='' } = game;

      // Convert date to selected timezone
      const displayDate = convertDateStr(date, _selectedTz);

      const banner = image
        ? `<img class="upcoming-card-banner" src="${image}" alt="${title}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
           <div class="upcoming-card-banner-placeholder" style="display:none">${calIcon}</div>`
        : `<div class="upcoming-card-banner-placeholder">${calIcon}</div>`;

      let matchupHtml = '';
      if (team1 || team2) {
        const t1Logo = team1 ? `<img class="upcoming-card-team-logo" src="Logos/${slugify(team1)}.png" alt="${team1}" data-jpg="Logos/${slugify(team1)}.jpg" onerror="handleLogoError(this)">` : '';
        const t2Logo = team2 ? `<img class="upcoming-card-team-logo" src="Logos/${slugify(team2)}.png" alt="${team2}" data-jpg="Logos/${slugify(team2)}.jpg" onerror="handleLogoError(this)">` : '';
        matchupHtml = `<div class="upcoming-card-matchup">
          <div class="upcoming-card-team">${t1Logo}<span class="upcoming-card-team-name">${team1}</span></div>
          <span class="upcoming-vs">VS</span>
          <div class="upcoming-card-team">${t2Logo}<span class="upcoming-card-team-name">${team2}</span></div>
        </div>`;
      }

      const descHtml = description ? `<div class="upcoming-card-desc">${description}</div>` : '';

      html += `<div class="upcoming-card">
        ${banner}
        <div class="upcoming-card-body">
          ${displayDate ? `<div class="upcoming-card-date">${displayDate}</div>` : ''}
          ${title ? `<div class="upcoming-card-title">${title}</div>` : ''}
          ${matchupHtml}
          ${descHtml}
        </div>
      </div>`;
    });
    html += '</div>';
    content.innerHTML = html;
  }

  window.onTzChange = function(tz) {
    _selectedTz = tz;
    _renderUpcomingCards();
  };

  // ══════════════════════════════════════════════════
  //  ROSTER — global store & Team Management renderer
  // ══════════════════════════════════════════════════
  let _roster = {};

  function renderRoster(roster) {
    _roster = roster || {};

    const loading = document.getElementById('teams-loading');
    const content = document.getElementById('teams-content');
    loading.style.display = 'none';
    content.style.display = 'block';

    const keys = Object.keys(_roster).sort();
    if (!keys.length) {
      content.innerHTML = '<p style="color:var(--muted);padding:32px">No roster data yet. Import an .xlsx and push from the Python app.</p>';
      attachHoverListeners();
      return;
    }

    let html = `<div style="display:flex;align-items:center;gap:16px;margin-bottom:20px">
      <input class="tm-search" id="tm-search" type="text" placeholder="🔍  Search player or team…" oninput="filterTmTable(this.value)">
      <span style="color:var(--muted);font-size:12px" id="tm-count"></span>
    </div>
    <div class="tm-table-wrap">
    <table class="tm-table" id="tm-table">
      <thead><tr>
        <th>Clan Tag</th><th>Clan Name</th><th>Team</th>
        <th>Team Captain</th><th>Player Name</th><th>AoM Profile</th>
        <th>Eligibility</th><th>Guest Player</th>
      </tr></thead><tbody>`;

    let totalPlayers = 0;
    keys.forEach(key => {
      const entry = _roster[key];
      const players = entry.players || [];
      totalPlayers += players.length;
      players.forEach(p => {
        const isCaptain = p.name === entry.captain;
        const isGuest   = (p.guest_player || '').toLowerCase() === 'yes';
        const eligible  = isEligible(p.eligibility || '');

        // Name colour — same logic as tooltip
        let nameColor;
        if (isCaptain) {
          nameColor = '#ff8c00';
        } else if (isGuest && eligible) {
          nameColor = '#6ab0f5';
        } else if (isGuest && !eligible) {
          nameColor = '#cc1f1f';
        } else if (eligible) {
          nameColor = '#2ecc71';
        } else {
          nameColor = '#cc1f1f';
        }

        const eligColor  = eligible ? '#2ecc71' : '#cc1f1f';
        const guestColor = isGuest
          ? (eligible ? '#6ab0f5' : '#cc1f1f')
          : 'var(--muted)';

        html += `<tr data-search="${(entry.clan_tag + ' ' + entry.clan_name + ' ' + entry.team + ' ' + entry.captain + ' ' + p.name).toLowerCase()}">
          <td><span class="tm-clan-tag">${entry.clan_tag || ''}</span></td>
          <td>${entry.clan_name || ''}</td>
          <td>${key}</td>
          <td>${entry.captain || ''}</td>
          <td><span style="color:${nameColor};font-weight:700">${p.name}${isCaptain ? ' ★' : ''}</span></td>
          <td>${p.url ? `<a href="${p.url}" target="_blank" rel="noopener">Profile ↗</a>` : '—'}</td>
          <td style="color:${eligColor};font-weight:700">${p.eligibility || '—'}</td>
          <td style="color:${guestColor};font-weight:700">${p.guest_player || '—'}</td>
        </tr>`;
      });

    html += `</tbody></table></div>`;
    content.innerHTML = html;
    document.getElementById('tm-count').textContent = `${totalPlayers} players · ${keys.length} teams`;
    attachHoverListeners();
  }

  window.filterTmTable = function(query) {
    const q = query.toLowerCase();
    const rows = document.querySelectorAll('#tm-table tbody tr');
    let visible = 0;
    rows.forEach(row => {
      const match = !q || row.dataset.search.includes(q);
      row.style.display = match ? '' : 'none';
      if (match) visible++;
    });
    const el = document.getElementById('tm-count');
    if (el) el.textContent = visible + ' players shown';
  };

  // ══════════════════════════════════════════════════
  //  STATS & RECS RENDERER
  // ══════════════════════════════════════════════════
  function renderStats(records) {
    const loading = document.getElementById('stats-loading');
    const content = document.getElementById('stats-content');
    loading.style.display = 'none';
    content.style.display = 'block';

    // Firebase converts arrays to {0:…,1:…} objects — normalise both levels
    const items = Array.isArray(records) ? records : Object.values(records || {});
    console.log('[Stats] game_records count:', items.length, items.slice(0,2));

    if (!items.length) {
      content.innerHTML = '<p style="color:var(--muted);padding:32px">No game records yet. Import an .xlsx from the Python app and push to Firebase.</p>';
      return;
    }

    // Collect unique rounds and groups for filter dropdowns
    const rounds = [...new Set(items.map(r => r.round).filter(Boolean))].sort();
    const groups = [...new Set(items.map(r => r.group).filter(Boolean))].sort();

    let html = `<div class="stats-filter-row">
      <input class="stats-filter" id="stats-search" type="text" placeholder="🔍  Search team…"
             oninput="filterStats()" style="min-width:200px">
      <select class="stats-filter" id="stats-round" onchange="filterStats()">
        <option value="">All Rounds</option>
        ${rounds.map(r => `<option value="${r}">${r}</option>`).join('')}
      </select>
      <select class="stats-filter" id="stats-group" onchange="filterStats()">
        <option value="">All Groups</option>
        ${groups.map(g => `<option value="${g}">${g}</option>`).join('')}
      </select>
      <span style="color:var(--muted);font-size:12px;align-self:center" id="stats-count">${items.length} games</span>
    </div>
    <div class="stats-table-wrap">
    <table class="stats-table" id="stats-table">
      <thead><tr>
        <th>Round</th><th>Group</th><th>Team 1</th><th>Team 2</th><th>Score</th><th>Rec (right-click → save as)</th><th>VOD</th>
      </tr></thead><tbody>`;

    items.forEach(r => {
      const search = `${r.round} ${r.group} ${r.team1} ${r.team2}`.toLowerCase();
      const recUrls = Array.isArray(r.rec_urls) ? r.rec_urls
                    : (r.rec_urls ? Object.values(r.rec_urls) : []);
      const dlBtns = recUrls.length
        ? recUrls.map((url, i) => {
            const label = `G${i + 1}`;
            return `<a class="stats-dl-btn" href="${url}" target="_top" rel="noopener">⬇ ${label}</a>`;
          }).join(' ')
        : '<span style="color:var(--muted);font-size:12px">—</span>';
      const vodBtn = r.vod_url
        ? `<a href="${r.vod_url}" target="_blank" rel="noopener" title="Watch VOD"
             style="display:inline-flex;align-items:center;gap:4px;color:#ff0000;text-decoration:none;font-size:18px;line-height:1">
             <svg viewBox="0 0 24 24" width="20" height="20" fill="#ff0000"><path d="M23.5 6.2s-.3-2-1.2-2.8c-1.1-1.2-2.4-1.2-3-1.3C16.6 2 12 2 12 2s-4.6 0-7.3.1c-.6.1-1.9.1-3 1.3C.8 4.2.5 6.2.5 6.2S.2 8.5.2 10.8v2.1c0 2.3.3 4.6.3 4.6s.3 2 1.2 2.8c1.1 1.2 2.6 1.1 3.3 1.2C7.2 21.7 12 21.8 12 21.8s4.6 0 7.3-.2c.6-.1 1.9-.1 3-1.3.9-.8 1.2-2.8 1.2-2.8s.3-2.3.3-4.6v-2.1C23.8 8.5 23.5 6.2 23.5 6.2zM9.7 15.5V8.4l8.1 3.6-8.1 3.5z"/></svg>
           </a>`
        : '<span style="color:var(--muted)">—</span>';
      html += `<tr data-search="${search}" data-round="${(r.round||'').toLowerCase()}" data-group="${(r.group||'').toLowerCase()}">
        <td>${r.round || ''}</td>
        <td>${r.group || ''}</td>
        <td>${r.team1 || ''}</td>
        <td>${r.team2 || ''}</td>
        <td class="score-cell">${r.score || ''}</td>
        <td>${dlBtns}</td>
        <td>${vodBtn}</td>

    html += '</tbody></table></div>';
    content.innerHTML = html;

  window.filterStats = function() {
    const q     = (document.getElementById('stats-search')?.value || '').toLowerCase();
    const round = (document.getElementById('stats-round')?.value  || '').toLowerCase();
    const group = (document.getElementById('stats-group')?.value  || '').toLowerCase();
    const rows  = document.querySelectorAll('#stats-table tbody tr');
    let visible = 0;
    rows.forEach(row => {
      const matchSearch = !q     || row.dataset.search.includes(q);
      const matchRound  = !round || row.dataset.round  === round;
      const matchGroup  = !group || row.dataset.group  === group;
      const show = matchSearch && matchRound && matchGroup;
      row.style.display = show ? '' : 'none';
      if (show) visible++;
    });
    const el = document.getElementById('stats-count');
    if (el) el.textContent = visible + ' games';
  };

  // ══════════════════════════════════════════════════
  //  SCHEDULING SYSTEM
  // ══════════════════════════════════════════════════
  import { ref as fbRef, set as fbSet, push as fbPush } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  let _schedData = { team_codes:{}, admin_code:'', availability:{}, scheduled_games:{}, game_records:[], groups:{} };
  let _schedSession = null;   // { teamKey, isAdmin }
  let _schedWeekOffset = 0;
  let _schedMatchup = null;   // { team1, team2, round, group }

  function schedUpdateData(data) {
    _schedData = data;
    if (_schedSession) _renderSchedMain();
  }

  // ── Login ───────────────────────────────────────
  function _renderSchedLogin(errorMsg) {
    const root = document.getElementById('scheduling-root');
    root.innerHTML = `
      <div class="sched-login">
        <h2>Scheduling</h2>
        <p>Enter your team access code (provided by the admin) or the admin code to manage scheduling.</p>
        <input class="sched-input" id="sched-code-input" type="text" placeholder="ENTER CODE"
               maxlength="20" oninput="this.value=this.value.toUpperCase()">
        ${errorMsg ? `<div class="sched-error">${errorMsg}</div>` : ''}
        <button class="sched-btn" onclick="schedLogin()">Enter</button>
      </div>`;
    document.getElementById('sched-code-input')?.focus();
  }

  window.schedLogin = function() {
    const code = (document.getElementById('sched-code-input')?.value || '').trim().toUpperCase();
    if (!code) return;

    // Check admin code
    const adminCode = (_schedData.admin_code || '').toUpperCase();
    if (adminCode && code === adminCode) {
      _schedSession = { teamKey: null, isAdmin: true };
      _renderSchedMain();
      return;
    }

    // Check team codes
    const codes = _schedData.team_codes || {};
    for (const [team, tc] of Object.entries(codes)) {
      if ((tc || '').toUpperCase() === code) {
        _schedSession = { teamKey: team, isAdmin: false };
        _schedMatchup = _findNextMatchup(team);
        _renderSchedMain();
        return;
      }
    }
    _renderSchedLogin('Invalid code. Try again.');
  };

  window.schedLogout = function() {
    _schedSession = null;
    _schedMatchup = null;
    _schedWeekOffset = 0;
    _renderSchedLogin();
  };

  // ── Matchup finder (from game_records) ──────────
  function _findNextMatchup(teamKey) {
    const records = Array.isArray(_schedData.game_records)
      ? _schedData.game_records : Object.values(_schedData.game_records || {});
    // Unplayed = no rec_urls and no score, involving this team
    for (const r of records) {
      const involves = r.team1 === teamKey || r.team2 === teamKey;
      const played   = (r.rec_urls && r.rec_urls.length) || r.score;
      if (involves && !played) return r;
    }
    return records.find(r => r.team1 === teamKey || r.team2 === teamKey) || null;
  }

  function _getMatchups(teamKey) {
    const records = Array.isArray(_schedData.game_records)
      ? _schedData.game_records : Object.values(_schedData.game_records || {});
    return records.filter(r => r.team1 === teamKey || r.team2 === teamKey);
  }

  // ── Week helpers ─────────────────────────────────
  function _weekStart(offset) {
    const d = new Date();
    d.setHours(0,0,0,0);
    const day = d.getDay();
    d.setDate(d.getDate() - day + 1 + offset * 7);   // Monday
    return d;
  }

  function _slotsForWeek(offset) {
    const start = _weekStart(offset);
    const slots = [];
    for (let d = 0; d < 7; d++) {
      const day = new Date(start);
      day.setDate(start.getDate() + d);
      for (let h = 0; h < 24; h++) {
        for (let m = 0; m < 60; m += 15) {
          const dt = new Date(day);
          dt.setHours(h, m, 0, 0);
          slots.push(dt);
        }
      }
    }
    return slots;
  }

  function _slotKey(dt) {
    return dt.toISOString().slice(0, 16);   // "2025-04-12T18:00"
  }

  // ── Main scheduling view ─────────────────────────
  function _renderSchedMain() {
    const { teamKey, isAdmin } = _schedSession;
    const root = document.getElementById('scheduling-root');

    if (isAdmin) {
      _renderSchedAdmin(root);
      return;
    }

    const matchups = _getMatchups(teamKey);
    if (!_schedMatchup && matchups.length) _schedMatchup = matchups[0];

    const matchupOptions = matchups.map(m => {
      const opp = m.team1 === teamKey ? m.team2 : m.team1;
      const label = `${m.round || ''} ${m.group ? '· Gr.' + m.group : ''} — vs ${opp}`.trim();
      const selected = _schedMatchup && m.team1 === _schedMatchup.team1 && m.team2 === _schedMatchup.team2 ? 'selected' : '';
      return `<option value="${m.team1}|||${m.team2}|||${m.round||''}|||${m.group||''}" ${selected}>${label}</option>`;
    }).join('');

    const otherTeam = _schedMatchup
      ? (_schedMatchup.team1 === teamKey ? _schedMatchup.team2 : _schedMatchup.team1)
      : null;

    root.innerHTML = `
      <div class="sched-header">
        <span class="sched-team-badge">👤 ${teamKey}</span>
        ${otherTeam ? `<span style="color:var(--muted);font-size:13px">vs <strong style="color:var(--white)">${otherTeam}</strong></span>` : ''}
        ${matchupOptions ? `<select class="sched-matchup-select" onchange="schedSelectMatchup(this.value)">${matchupOptions}</select>` : ''}
        <button class="sched-logout" onclick="schedLogout()">Log out</button>
      </div>
      <div class="sched-legend">
        <span class="sched-legend-item"><span class="sched-legend-dot" style="background:rgba(204,31,31,0.45)"></span> My availability</span>
        <span class="sched-legend-item"><span class="sched-legend-dot" style="background:rgba(74,158,255,0.35)"></span> ${otherTeam || 'Opponent'} availability</span>
        <span class="sched-legend-item"><span class="sched-legend-dot" style="background:rgba(46,204,113,0.55)"></span> Overlap (both free)</span>
        <span class="sched-legend-item"><span class="sched-legend-dot" style="background:rgba(255,165,0,0.6)"></span> Confirmed</span>
      </div>
      <div class="sched-week-nav">
        <button onclick="schedWeek(-1)">◀ Prev</button>
        <span class="sched-week-label" id="sched-week-lbl"></span>
        <button onclick="schedWeek(1)">Next ▶</button>
      </div>
      <div class="sched-cal-wrap" id="sched-cal-wrap"></div>
      <div class="sched-overlap-list" id="sched-overlaps"></div>
      <div class="sched-audit" id="sched-audit"></div>`;

    _renderCalendar(teamKey, otherTeam);
    _renderOverlaps(teamKey, otherTeam);
    _renderAudit();
  }

  window.schedSelectMatchup = function(val) {
    const [t1, t2, round, group] = val.split('|||');
    _schedMatchup = { team1: t1, team2: t2, round, group };
    _renderSchedMain();
  };

  window.schedWeek = function(dir) {
    _schedWeekOffset += dir;
    const { teamKey } = _schedSession;
    const otherTeam = _schedMatchup
      ? (_schedMatchup.team1 === teamKey ? _schedMatchup.team2 : teamKey === _schedMatchup.team2 ? _schedMatchup.team1 : null)
      : null;
    _renderCalendar(teamKey, otherTeam);
    _renderOverlaps(teamKey, otherTeam);
  };

  function _renderCalendar(myTeam, otherTeam) {
    const wrap = document.getElementById('sched-cal-wrap');
    const lbl  = document.getElementById('sched-week-lbl');
    if (!wrap) return;

    const ws = _weekStart(_schedWeekOffset);
    const we = new Date(ws); we.setDate(ws.getDate() + 6);
    lbl && (lbl.textContent = `${ws.toLocaleDateString('en-GB',{day:'numeric',month:'short'})} – ${we.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}`);

    const myAvail    = _schedData.availability?.[myTeam]    || {};
    const theirAvail = otherTeam ? (_schedData.availability?.[otherTeam] || {}) : {};
    const confirmed  = _schedData.scheduled_games || {};

    // Day headers
    const days = [];
    for (let i = 0; i < 7; i++) {
      const d = new Date(ws); d.setDate(ws.getDate() + i);
      days.push(d);
    }

    let html = `<table class="sched-cal"><thead><tr>
      <th style="width:56px"></th>
      ${days.map(d => `<th>${d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})}</th>`).join('')}
    </tr></thead><tbody>`;

    // All 24 hours, 15-min slots
    for (let h = 0; h < 24; h++) {
      for (let m = 0; m < 60; m += 15) {
        html += `<tr>`;
        html += `<td class="sched-time-label">${m === 0 ? `${String(h).padStart(2,'0')}:00` : ''}</td>`;
        for (let d = 0; d < 7; d++) {
          const dt  = new Date(days[d]); dt.setHours(h, m, 0, 0);
          const key = _slotKey(dt);
          const mine    = !!myAvail[key];
          const theirs  = !!theirAvail[key];
          const isConf  = Object.values(confirmed).some(g => g.datetime === key);
          let cls = 'empty';
          if (isConf)              cls = 'confirmed';
          else if (mine && theirs) cls = 'overlap';
          else if (mine)           cls = 'mine';
          else if (theirs)         cls = 'theirs';
          const tip = isConf ? 'Confirmed game' : cls === 'overlap' ? 'Both available!' : 'Click to toggle availability';
          html += `<td class="sched-slot ${cls}" data-key="${key}" data-team="${myTeam}" title="${tip}"></td>`;
        }
        html += `</tr>`;
      }
    }
    html += '</tbody></table>';
    wrap.innerHTML = html;

    // Clear any old listeners by replacing innerHTML (already done above)
    // Attach single delegated click listener
    wrap._schedBound = true;
    wrap.onclick = (e) => {
      const slot = e.target.closest('.sched-slot');
      if (!slot) return;
      const key  = slot.dataset.key;
      const team = slot.dataset.team;
      if (key && team) window.schedToggleSlot(key, team);
    };

    // Drag to select multiple slots
    let _dragging = false;
    let _dragAction = null;
    wrap.onmousedown = (e) => {
      const slot = e.target.closest('.sched-slot');
      if (!slot) return;
      e.preventDefault();
      _dragging = true;
      _dragAction = slot.classList.contains('mine') ? 'remove' : 'add';
    };
    wrap.onmousemove = (e) => {
      if (!_dragging) return;
      const slot = e.target.closest('.sched-slot');
      if (!slot) return;
      const key  = slot.dataset.key;
      const team = slot.dataset.team;
      if (!key || !team) return;
      const myAvail = _schedData.availability?.[team] || {};
      const alreadyOn = !!myAvail[key];
      if (_dragAction === 'add'    && !alreadyOn) window.schedToggleSlot(key, team);
      if (_dragAction === 'remove' &&  alreadyOn) window.schedToggleSlot(key, team);
    };
    document.onmouseup = () => { _dragging = false; _dragAction = null; };
  }

  window.schedToggleSlot = async function(key, myTeam) {
    // Optimistic local update first so UI responds immediately
    if (!_schedData.availability) _schedData.availability = {};
    if (!_schedData.availability[myTeam]) _schedData.availability[myTeam] = {};
    const isOn = !!_schedData.availability[myTeam][key];
    if (isOn) {
      delete _schedData.availability[myTeam][key];
    } else {
      _schedData.availability[myTeam][key] = true;
    }

    // Re-render calendar immediately
    const { teamKey } = _schedSession || {};
    const otherTeam = _schedMatchup
      ? (_schedMatchup.team1 === teamKey ? _schedMatchup.team2 : _schedMatchup.team1)
      : null;
    _renderCalendar(teamKey, otherTeam);
    _renderOverlaps(teamKey, otherTeam);

    // Sanitise keys for Firebase path (replace non-alphanumeric with _)
    const safeTeam = myTeam.replace(/[^a-zA-Z0-9]/g, '_');
    const safeKey  = key.replace(/[^a-zA-Z0-9]/g, '_');
    const path = `tournament/availability/${safeTeam}/${safeKey}`;

    const auditEntry = {
      team: myTeam,
      action: isOn ? 'removed' : 'added',
      slot: key,
      timestamp: new Date().toISOString(),
    };

    try {
      await fbSet(fbRef(database, path), isOn ? null : true);
      await fbPush(fbRef(database, 'tournament/audit_log'), auditEntry);
    } catch(e) {
      console.error('Firebase write error:', e);
      // Revert local state if Firebase write failed
      if (isOn) {
        _schedData.availability[myTeam][key] = true;
      } else {
        delete _schedData.availability[myTeam][key];
      }
      _renderCalendar(teamKey, otherTeam);
    }
  };

  function _renderOverlaps(myTeam, otherTeam) {
    const el = document.getElementById('sched-overlaps');
    if (!el || !otherTeam) return;

    const myAvail    = _schedData.availability?.[myTeam]    || {};
    const theirAvail = _schedData.availability?.[otherTeam] || {};
    const confirmed  = _schedData.scheduled_games           || {};

    const overlaps = Object.keys(myAvail).filter(k => theirAvail[k]).sort();
    if (!overlaps.length) { el.innerHTML = ''; return; }

    const myKey    = myTeam.replace(/[^a-zA-Z0-9_]/g, '_');
    const theirKey = otherTeam.replace(/[^a-zA-Z0-9_]/g, '_');
    const matchKey = [myKey, theirKey].sort().join('_vs_');

    const confirmedGame = confirmed[matchKey];

    let html = `<div class="sched-overlap-list"><h3>🟢 Available Overlap Slots (${overlaps.length})</h3>`;
    overlaps.slice(0, 20).forEach(k => {
      const dt = new Date(k);
      const label = dt.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'}) + ' · ' +
                    dt.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}) + ' GMT';
      const isThisConfirmed = confirmedGame?.datetime === k;
      const bothConfirmed = confirmedGame?.confirmed_by?.includes(myTeam) && confirmedGame?.confirmed_by?.includes(otherTeam);
      html += `<div class="sched-overlap-item">
        <span class="sched-overlap-time">${label}</span>
        ${isThisConfirmed && bothConfirmed
          ? `<span style="color:#ffa500;font-size:12px;font-weight:700">✓ CONFIRMED</span>`
          : `<button class="sched-confirm-btn ${isThisConfirmed ? 'confirmed' : ''}"
               onclick="schedConfirm('${k}','${myTeam}','${otherTeam}','${matchKey}')">
               ${isThisConfirmed ? (confirmedGame?.confirmed_by?.includes(myTeam) ? 'Waiting for opponent' : 'Confirm') : 'Propose this slot'}
             </button>`}
      </div>`;
    });
    html += '</div>';
    el.innerHTML = html;
  }

  window.schedConfirm = async function(datetime, myTeam, otherTeam, matchKey) {
    const existing = _schedData.scheduled_games?.[matchKey] || {};
    const confirmedBy = existing.confirmed_by || [];

    if (!confirmedBy.includes(myTeam)) confirmedBy.push(myTeam);

    const bothConfirmed = confirmedBy.includes(myTeam) && confirmedBy.includes(otherTeam);
    const dt = new Date(datetime);
    const label = dt.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'}) + ' · ' +
                  dt.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}) + ' GMT';

    const gameData = {
      datetime,
      team1: _schedMatchup?.team1 || myTeam,
      team2: _schedMatchup?.team2 || otherTeam,
      round: _schedMatchup?.round || '',
      group: _schedMatchup?.group || '',
      confirmed_by: confirmedBy,
      proposed_by: existing.proposed_by || myTeam,
      label,
      status: bothConfirmed ? 'confirmed' : 'pending',
    };

    const auditEntry = {
      team: myTeam,
      action: bothConfirmed ? 'confirmed_game' : 'proposed_slot',
      slot: datetime,
      matchup: `${gameData.team1} vs ${gameData.team2}`,
      timestamp: new Date().toISOString(),
    };

    try {
      await fbSet(fbRef(database, `tournament/scheduled_games/${matchKey}`), gameData);
      await fbPush(fbRef(database, 'tournament/audit_log'), auditEntry);

      // If both confirmed, push to upcoming games
      if (bothConfirmed) {
        const upcoming = Array.isArray(_schedData.upcoming) ? [..._schedData.upcoming] : Object.values(_schedData.upcoming || {});
        const existingIdx = upcoming.findIndex(u => u._match_key === matchKey);
        const newEntry = {
          title: `${gameData.round ? gameData.round + ' — ' : ''}${gameData.team1} vs ${gameData.team2}`,
          date: label,
          team1: gameData.team1,
          team2: gameData.team2,
          description: `Confirmed by both captains`,
          image: '',
          _match_key: matchKey,
        };
        if (existingIdx >= 0) upcoming[existingIdx] = newEntry;
        else upcoming.push(newEntry);
        await fbSet(fbRef(database, 'tournament/upcoming'), upcoming);
      }
    } catch(e) {
      console.error('Firebase confirm error:', e);
    }
  };

  function _renderAudit() {
    const el = document.getElementById('sched-audit');
    if (!el) return;
    const log = _schedData.audit_log || {};
    const entries = Object.values(log).sort((a,b) => b.timestamp > a.timestamp ? 1 : -1).slice(0, 15);
    if (!entries.length) { el.innerHTML = ''; return; }
    let html = '<div class="sched-audit"><h3>Audit Trail</h3>';
    entries.forEach(e => {
      const ts = new Date(e.timestamp).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
      const actionLabel = {
        added: 'marked available',
        removed: 'removed availability',
        proposed_slot: 'proposed slot',
        confirmed_game: 'confirmed game',
      }[e.action] || e.action;
      html += `<div class="sched-audit-entry">
        <span class="sched-audit-team">${e.team}</span> ${actionLabel}
        ${e.slot ? `<span style="color:#4a9eff"> ${new Date(e.slot).toLocaleString('en-GB',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</span>` : ''}
        ${e.matchup ? `<span> for ${e.matchup}</span>` : ''}
        <span style="float:right;color:#555">${ts}</span>
      </div>`;
    });
    html += '</div>';
    el.innerHTML = html;
  }

  // Admin view — overview of all scheduled games
  function _renderSchedAdmin(root) {
    const games = Object.values(_schedData.scheduled_games || {});
    const audit  = Object.values(_schedData.audit_log || {}).sort((a,b) => b.timestamp > a.timestamp ? 1:-1).slice(0,30);

    let html = `<div class="sched-header">
      <span class="sched-team-badge">🔧 ADMIN</span>
      <button class="sched-logout" onclick="schedLogout()">Log out</button>
    </div>`;

    // Scheduled games overview
    html += `<h3 style="font-size:15px;font-weight:900;margin-bottom:12px">Scheduled Games</h3>`;
    if (!games.length) {
      html += `<p style="color:var(--muted);font-size:13px;margin-bottom:20px">No games scheduled yet.</p>`;
    } else {
      games.forEach(g => {
        const status = g.status === 'confirmed' ? '✓ CONFIRMED' : '⏳ Pending';
        const color  = g.status === 'confirmed' ? '#2ecc71' : '#ffa500';
        html += `<div class="sched-overlap-item">
          <span class="sched-overlap-time">${g.team1} vs ${g.team2}</span>
          <span style="color:var(--muted);font-size:12px">${g.label || g.datetime}</span>
          <span style="color:${color};font-size:12px;font-weight:700">${status}</span>
        </div>`;
      });
    }

    // Audit log
    html += `<div class="sched-audit" style="margin-top:20px"><h3>Full Audit Trail</h3>`;
    audit.forEach(e => {
      const ts = new Date(e.timestamp).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
      const actionLabel = { added:'marked available', removed:'removed availability',
        proposed_slot:'proposed slot', confirmed_game:'confirmed game' }[e.action] || e.action;
      html += `<div class="sched-audit-entry">
        <span class="sched-audit-team">${e.team}</span> ${actionLabel}
        ${e.matchup ? `<span> for ${e.matchup}</span>` : ''}
        ${e.slot ? `<span style="color:#4a9eff"> ${new Date(e.slot).toLocaleString('en-GB',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</span>` : ''}
        <span style="float:right;color:#555">${ts}</span>
      </div>`;
    });
    html += '</div>';
    root.innerHTML = html;
  }

  // Init scheduling login on load
  _renderSchedLogin();

  // ══════════════════════════════════════════════════
  //  PLAYER CLICK PANEL
  // ══════════════════════════════════════════════════
  const _tooltip = document.getElementById('player-tooltip');
  let _currentKey = null;

  // ── Eligibility helper ──
  function isEligible(eligStr) {
    if (!eligStr || eligStr.trim() === '' || eligStr.trim() === '-') return true;
    const parts = eligStr.trim().split('/');
    if (parts.length === 3) {
      const d = new Date(parseInt(parts[2]), parseInt(parts[1]) - 1, parseInt(parts[0]));
      if (!isNaN(d.getTime())) return d <= new Date();
    }
    return true;
  }

  function buildTooltipHtml(teamKey) {
    const entry = _roster[teamKey];
    if (!entry || !entry.players || !entry.players.length) return null;
    const captain = entry.captain || '';

    let html = `<div class="tooltip-header">
      <span>${teamKey} — ROSTER</span>
      <span class="tooltip-close" onclick="closePanel()">✕</span>
    </div>`;
    html += `<div class="tooltip-col-headers">
      <span>Player</span><span>Eligibility</span><span>Profile</span>
    </div>`;

    entry.players.forEach(p => {
      const isCap    = p.name === captain;
      const isGuest  = (p.guest_player || '').toLowerCase() === 'yes';
      const eligible = isEligible(p.eligibility || '');
      const eligStr  = (p.eligibility && p.eligibility.trim() && p.eligibility.trim() !== '-')
                       ? p.eligibility : '✓';

      let nameColor;
      if (isCap)                        nameColor = '#ff8c00';
      else if (isGuest && eligible)     nameColor = '#6ab0f5';
      else if (isGuest && !eligible)    nameColor = '#cc1f1f';
      else if (eligible)                nameColor = '#2ecc71';
      else                              nameColor = '#cc1f1f';

      const eligColor = eligible ? '#2ecc71' : '#cc1f1f';
      const profileLink = p.url
        ? `<a href="${p.url}" target="_blank" rel="noopener noreferrer"
             onclick="event.stopPropagation()">↗</a>`
        : '<span style="color:var(--muted)">—</span>';

      html += `<div class="tooltip-player">
        <span class="tooltip-player-name" style="color:${nameColor}">${p.name}${isCap ? ' ★' : ''}</span>
        <span class="tooltip-elig" style="color:${eligColor}">${eligStr}</span>
        ${profileLink}
      </div>`;
    });
    return html;
  }

  function openPanel(el, teamKey) {
    if (!_roster[teamKey]) return;
    // Toggle — click same team again to close
    if (_currentKey === teamKey && _tooltip.classList.contains('visible')) {
      closePanel();
      return;
    }
    const html = buildTooltipHtml(teamKey);
    if (!html) return;
    _currentKey = teamKey;
    _tooltip.innerHTML = html;
    _tooltip.classList.add('visible');
    positionPanel(el);
  }

  function closePanel() {
    _tooltip.classList.remove('visible');
    _currentKey = null;
  }
  window.closePanel = closePanel;

  function positionPanel(el) {
    const r   = el.getBoundingClientRect();
    const tw  = _tooltip.offsetWidth  || 260;
    const th  = _tooltip.offsetHeight || 200;
    const pad = 10;
    let left = r.right + pad;
    if (left + tw > window.innerWidth - pad) left = r.left - tw - pad;
    let top = r.top;
    if (top + th > window.innerHeight - pad) top = window.innerHeight - th - pad;
    if (top < pad) top = pad;
    _tooltip.style.left = left + 'px';
    _tooltip.style.top  = top  + 'px';
  }

  // Close panel when clicking outside it
  document.addEventListener('click', (e) => {
    if (_tooltip.classList.contains('visible') &&
        !_tooltip.contains(e.target) &&
        !e.target.closest('[data-panel-trigger]')) {
      closePanel();
    }
  });

  function attachHoverListeners() {
    // Bracket: attach click to .team-row — always bind, check roster at click time
    document.querySelectorAll('.team-row').forEach(el => {
      if (el.dataset.hoverBound) return;
      el.dataset.hoverBound = '1';
      el.addEventListener('click', (e) => {
        const nameEl = el.querySelector('.team-name');
        if (!nameEl) return;
        const raw = nameEl.textContent.trim();
        if (!raw || raw === 'TBD') return;
        if (!_roster[raw]) return;
        nameEl.classList.add('team-name-clickable');
        e.stopPropagation();
        openPanel(el, raw);
      });
    });

    // Groups table: attach click to .team-name spans
    document.querySelectorAll('.team-name').forEach(el => {
      if (el.dataset.hoverBound) return;
      el.dataset.hoverBound = '1';
      el.addEventListener('click', (e) => {
        const raw = el.textContent.trim();
        if (!raw || raw === 'TBD') return;
        if (!_roster[raw]) return;
        el.classList.add('team-name-clickable');
        e.stopPropagation();
        openPanel(el, raw);
      });
    });

    // Update cursor and underline for any already-known roster teams
    document.querySelectorAll('.team-name').forEach(el => {
      const raw = el.textContent.trim();
      if (raw && raw !== 'TBD' && _roster[raw]) {
        el.classList.add('team-name-clickable');
      }
    });
  }
</script>

<script>
  function handleLogoError(img) {
    if (img.src.indexOf('.png') > -1) {
      img.src = img.dataset.jpg;
    } else {
      img.classList.add('hidden');
    }
  }

  function showTab(name) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    event.target.classList.add('active');
    document.getElementById(name + '-page').classList.add('active');
  }
</script>
</body>
</html>
