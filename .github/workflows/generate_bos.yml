name: Generate Build Order HTML

on:
  push:
    branches: [main]
    paths:
      - 'ExcelUploads/**.xlsx'
      - 'scripts/convert_excel.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bo-generation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pandas openpyxl

      - name: Generate HTML
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            find ExcelUploads -name "*.xlsx" -print0 | xargs -0 -I{} python scripts/convert_excel.py "{}" --outdir "BO"
          else
            git diff --name-only HEAD^ HEAD -- "ExcelUploads/*.xlsx" | while IFS= read -r f; do
              [ -f "$f" ] && python scripts/convert_excel.py "$f" --outdir "BO"
            done
          fi

      - name: Commit and push generated files
        run: |
          git config user.name "bo-generator[bot]"
          git config user.email "bo-generator[bot]@users.noreply.github.com"
          git add BO/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-generate build order HTML [skip ci]"
            git push
          fi
