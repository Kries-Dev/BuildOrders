<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Deities of Death — Age of Mythology: Retold</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@400;500;600&family=Share+Tech+Mono&display=swap" rel="stylesheet"/>
<style>
:root {
  --black:   #080808;
  --bg:      #0e0e0e;
  --surface: #141414;
  --lift:    #1a1a1a;
  --border:  #242424;
  --border2: #2e2e2e;
  --red:     #c41e1e;
  --red-hi:  #e02222;
  --red-dim: rgba(196,30,30,0.18);
  --muted:   #555;
  --sub:     #888;
  --text:    #d8d8d8;
  --white:   #f2f2f2;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}

body{
  background:var(--black);
  color:var(--text);
  font-family:'Barlow',sans-serif;
  font-weight:400;
  min-height:100vh;
  overflow-x:hidden;
}

/* subtle diagonal grid bg */
body::before{
  content:'';
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:
    linear-gradient(rgba(255,255,255,0.012) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,0.012) 1px,transparent 1px);
  background-size:48px 48px;
}

/* ── HEADER ─────────────────────────────────────── */
header{
  position:relative;z-index:10;
  display:flex;align-items:center;gap:20px;
  padding:18px 36px;
  background:var(--bg);
  border-bottom:1px solid var(--border);
}

/* thin red rule under header */
header::after{
  content:'';
  position:absolute;bottom:-1px;left:0;right:0;height:1px;
  background:linear-gradient(90deg,var(--red) 0%,transparent 60%);
}

/* logo — circular, bleeds into bg */
.logo-ring{
  width:72px;height:72px;
  border-radius:50%;
  border:1px solid var(--border2);
  overflow:hidden;
  flex-shrink:0;
  background:var(--black);
  box-shadow:0 0 0 1px rgba(196,30,30,0.25), 0 4px 24px rgba(0,0,0,0.8);
}
.logo-ring img{
  width:100%;height:100%;
  object-fit:cover;
  /* nudge the grim reaper to center better */
  object-position:center center;
  transform:scale(1.08);
}

.header-title{flex:1}

.header-title h1{
  font-family:'Barlow Condensed',sans-serif;
  font-weight:800;
  font-size:clamp(22px,3.2vw,40px);
  letter-spacing:1px;
  color:var(--white);
  line-height:1;
}

.header-title .sub{
  font-family:'Share Tech Mono',monospace;
  font-size:11px;
  letter-spacing:3px;
  color:var(--muted);
  text-transform:uppercase;
  margin-top:5px;
}

.header-meta{
  text-align:right;
  font-family:'Share Tech Mono',monospace;
  font-size:11px;
  letter-spacing:2px;
  color:var(--muted);
  line-height:1.8;
}

.header-meta .big{
  display:block;
  font-family:'Barlow Condensed',sans-serif;
  font-weight:700;
  font-size:28px;
  letter-spacing:2px;
  color:var(--red-hi);
  line-height:1;
  margin-bottom:2px;
}

/* ── CONTROLS ───────────────────────────────────── */
.controls{
  position:sticky;top:0;z-index:50;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:10px 36px;
  background:rgba(10,10,10,0.96);
  border-bottom:1px solid var(--border);
  backdrop-filter:blur(10px);
}

.search-wrap{position:relative;flex:1;min-width:200px;max-width:380px}
.search-wrap svg{
  position:absolute;left:12px;top:50%;
  transform:translateY(-50%);
  color:var(--muted);pointer-events:none;
  width:15px;height:15px;
}

#search{
  width:100%;
  background:var(--surface);
  border:1px solid var(--border2);
  border-radius:2px;
  padding:9px 12px 9px 38px;
  color:var(--white);
  font-family:'Barlow Condensed',sans-serif;
  font-size:15px;font-weight:600;letter-spacing:2px;
  text-transform:uppercase;
  outline:none;
  transition:border-color .15s,box-shadow .15s;
}
#search:focus{
  border-color:var(--red);
  box-shadow:0 0 0 1px var(--red-dim);
}
#search::placeholder{color:var(--muted);font-weight:400;text-transform:uppercase}

.vol-wrap{
  display:flex;align-items:center;gap:8px;
  font-family:'Share Tech Mono',monospace;
  font-size:10px;letter-spacing:2px;color:var(--muted);
}
input[type=range]{
  -webkit-appearance:none;width:80px;height:2px;
  background:var(--border2);border-radius:1px;outline:none;cursor:pointer;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:12px;height:12px;
  border-radius:50%;background:var(--red);cursor:pointer;
}

#stopAll{
  background:transparent;
  border:1px solid var(--border2);
  color:var(--sub);
  padding:8px 16px;
  font-family:'Barlow Condensed',sans-serif;
  font-size:13px;font-weight:700;letter-spacing:3px;
  text-transform:uppercase;
  cursor:pointer;border-radius:2px;
  transition:border-color .15s,color .15s,background .15s;
  white-space:nowrap;
}
#stopAll:hover{
  border-color:var(--red);color:var(--white);
  background:rgba(196,30,30,0.12);
}

/* ── TABS ───────────────────────────────────────── */
.tabs-wrap{
  display:flex;align-items:stretch;gap:0;
  padding:0 36px;
  background:var(--surface);
  border-bottom:1px solid var(--border);
  overflow-x:auto;
}
.tabs-wrap::-webkit-scrollbar{height:2px}
.tabs-wrap::-webkit-scrollbar-thumb{background:var(--red)}

.tab{
  position:relative;
  padding:12px 22px;
  font-family:'Barlow Condensed',sans-serif;
  font-size:14px;font-weight:700;letter-spacing:3px;
  text-transform:uppercase;
  color:var(--muted);
  cursor:pointer;white-space:nowrap;
  transition:color .15s;
  user-select:none;
  border-bottom:2px solid transparent;
}
.tab:hover{color:var(--sub)}
.tab.active{color:var(--white);border-bottom-color:var(--red)}
.tab .ct{
  font-family:'Share Tech Mono',monospace;
  font-size:10px;letter-spacing:1px;
  color:var(--red);margin-left:6px;
}

/* ── GRID SECTION ───────────────────────────────── */
.grid-section{
  position:relative;z-index:1;
  padding:28px 36px;
}

.section-head{
  display:flex;align-items:center;gap:14px;
  margin-bottom:14px;
}
.section-head .name{
  font-family:'Barlow Condensed',sans-serif;
  font-size:11px;font-weight:700;letter-spacing:5px;
  text-transform:uppercase;color:var(--red);
}
.section-head .line{
  flex:1;height:1px;
  background:linear-gradient(90deg,var(--border2),transparent);
}
.section-head .cnt{
  font-family:'Share Tech Mono',monospace;
  font-size:10px;letter-spacing:2px;color:var(--muted);
}

.sound-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(170px,1fr));
  gap:6px;
}

/* ── SOUND BUTTON ───────────────────────────────── */
.snd-btn{
  position:relative;
  display:flex;align-items:flex-start;gap:10px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:2px;
  padding:11px 13px;
  cursor:pointer;
  text-align:left;overflow:hidden;
  transition:border-color .12s,background .12s,transform .08s;
}
.snd-btn:hover{
  border-color:var(--border2);
  background:var(--lift);
  transform:translateY(-1px);
}
.snd-btn:hover .snd-icon{color:var(--red-hi)}
.snd-btn:active{transform:none}

.snd-btn.playing{
  border-color:var(--red);
  background:rgba(196,30,30,0.07);
}
.snd-btn.playing .snd-icon{color:var(--red-hi)}
.snd-btn.playing .snd-name{color:var(--white)}

/* red left strip on playing */
.snd-btn.playing::before{
  content:'';
  position:absolute;left:0;top:0;bottom:0;width:2px;
  background:var(--red);
  box-shadow:0 0 8px var(--red);
}

.snd-icon{
  width:16px;height:16px;flex-shrink:0;
  color:var(--muted);margin-top:1px;
  transition:color .12s;
}

.snd-name{
  font-family:'Barlow Condensed',sans-serif;
  font-size:14px;font-weight:600;letter-spacing:1px;
  color:var(--sub);line-height:1.25;
  transition:color .12s;
  word-break:break-word;
}
.snd-btn:hover .snd-name{color:var(--text)}

/* ripple */
.snd-btn .ripple{
  position:absolute;border-radius:50%;
  background:rgba(196,30,30,0.22);
  transform:scale(0);animation:rpl .45s linear;
  pointer-events:none;
}
@keyframes rpl{to{transform:scale(4);opacity:0}}

/* ── STATUS ─────────────────────────────────────── */
.status-msg{
  grid-column:1/-1;
  padding:60px 20px;text-align:center;
  font-family:'Share Tech Mono',monospace;
  font-size:12px;letter-spacing:3px;color:var(--muted);
}
.loader{
  display:inline-block;
  width:24px;height:24px;
  border:1px solid var(--border2);
  border-top-color:var(--red);
  border-radius:50%;
  animation:spin .75s linear infinite;
  margin-bottom:14px;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── NOW PLAYING ────────────────────────────────── */
#nowPlaying{
  position:fixed;bottom:0;left:0;right:0;z-index:200;
  display:flex;align-items:center;gap:14px;
  padding:11px 36px;
  background:rgba(8,8,8,0.98);
  border-top:1px solid var(--border);
  transform:translateY(100%);
  transition:transform .25s ease;
  backdrop-filter:blur(14px);
}
#nowPlaying.visible{transform:translateY(0)}
#nowPlaying::before{
  content:'';
  position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,var(--red),transparent 50%);
}
.np-pill{
  width:6px;height:6px;border-radius:50%;
  background:var(--red-hi);flex-shrink:0;
  animation:blink 1.2s ease-in-out infinite alternate;
}
@keyframes blink{from{opacity:1}to{opacity:.25}}
.np-info{flex:1;min-width:0}
.np-label{
  font-family:'Share Tech Mono',monospace;
  font-size:9px;letter-spacing:3px;color:var(--red);
}
.np-name{
  font-family:'Barlow Condensed',sans-serif;
  font-size:15px;font-weight:700;letter-spacing:2px;
  color:var(--white);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.waveform{display:flex;align-items:center;gap:2px;height:16px}
.wb{
  width:2px;background:var(--red);border-radius:1px;
  animation:wv .6s ease-in-out infinite alternate;
}
.wb:nth-child(1){height:5px;animation-delay:0s}
.wb:nth-child(2){height:12px;animation-delay:.1s}
.wb:nth-child(3){height:16px;animation-delay:.2s}
.wb:nth-child(4){height:9px;animation-delay:.3s}
.wb:nth-child(5){height:14px;animation-delay:.15s}
.wb:nth-child(6){height:7px;animation-delay:.25s}
@keyframes wv{from{transform:scaleY(.25);opacity:.4}to{transform:scaleY(1);opacity:1}}

/* ── ERROR ──────────────────────────────────────── */
.err{
  margin:40px 36px;
  border:1px solid #3a1010;
  padding:20px 24px;
  background:rgba(196,30,30,0.04);
  border-radius:2px;
  font-family:'Share Tech Mono',monospace;
  font-size:12px;letter-spacing:2px;color:#c44;
}

/* ── RESPONSIVE ─────────────────────────────────── */
@media(max-width:640px){
  header{padding:14px 16px;gap:14px}
  .header-meta{display:none}
  .controls{padding:10px 16px}
  .tabs-wrap{padding:0 16px}
  .grid-section{padding:20px 16px}
  #nowPlaying{padding:10px 16px}
  .sound-grid{grid-template-columns:repeat(auto-fill,minmax(145px,1fr))}
}

::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
::-webkit-scrollbar-thumb:hover{background:var(--red)}
</style>
</head>

async function fetchSounds(){
  showLoading('Loading sounds…');
  try{
    const top=await ghFetch(API_BASE);
    let sounds=[];
    const dirs=top.filter(i=>i.type==='dir');
    const files=top.filter(i=>i.type==='file'&&isAudio(i.name));
    if(dirs.length){
      for(const dir of dirs){
        const pan=dir.name.toUpperCase();
        const contents=await ghFetch(dir.url);
        contents.filter(f=>f.type==='file'&&isAudio(f.name)).forEach(f=>{
          sounds.push({name:cleanName(f.name),file:f.name,pantheon:pan,
            url:`https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/${BRANCH}/${SOUNDS_PATH}/${dir.name}/${f.name}`});
        });
      }
      files.forEach(f=>sounds.push({name:cleanName(f.name),file:f.name,pantheon:detectPantheon(f.name),url:RAW_BASE+f.name}));
    } else {
      files.forEach(f=>sounds.push({name:cleanName(f.name),file:f.name,pantheon:detectPantheon(f.name),url:RAW_BASE+f.name}));
    }
    allSounds=sounds.sort((a,b)=>a.name.localeCompare(b.name));
    buildTabs();renderGrid();
    document.getElementById('totalCount').textContent=allSounds.length;
  }catch(err){
    document.getElementById('main').innerHTML=`<div class="err">⚠ Failed to load sounds<br><br>${err.message}</div>`;
  }
}

async function ghFetch(url){
  const r=await fetch(url);
  if(!r.ok)throw new Error(`GitHub API ${r.status}: ${r.statusText}`);
  return r.json();
}

const isAudio=n=>/\.(mp3|wav|ogg|flac|m4a|aac|opus|weba)$/i.test(n);

function cleanName(f){
  return f.replace(/\.[^.]+$/,'')
    .replace(/^(japanese|greek|norse|egyptian|atlantean|chinese)[-_]/i,'')
    .replace(/[-_]+/g,' ')
    .replace(/\b\w/g,c=>c.toUpperCase()).trim();
}

function detectPantheon(filename){
  const l=filename.toLowerCase();
  for(const [pan,keys] of Object.entries(PANTHEON_MAP))
    if(keys.some(k=>l.includes(k)))return pan;
  return 'OTHER';
}

function buildTabs(){
  const pans=[...new Set(allSounds.map(s=>s.pantheon))].sort();
  const wrap=document.getElementById('tabsWrap');
  while(wrap.children.length>1)wrap.removeChild(wrap.lastChild);
  document.getElementById('tabCountAll').textContent=allSounds.length;
  document.getElementById('pantheonCount').textContent=pans.length+' pantheon'+(pans.length!==1?'s':'');
  pans.forEach(p=>{
    const cnt=allSounds.filter(s=>s.pantheon===p).length;
    const t=document.createElement('div');
    t.className='tab';t.dataset.pantheon=p;
    t.innerHTML=`${p[0]+p.slice(1).toLowerCase()}<span class="ct">${cnt}</span>`;
    t.addEventListener('click',()=>switchTab(p));
    wrap.appendChild(t);
  });
  document.querySelector('.tab[data-pantheon="all"]').addEventListener('click',()=>switchTab('all'));
}

function switchTab(p){
  activePan=p;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.pantheon===p));
  renderGrid();
}

function renderGrid(){
  const q=document.getElementById('search').value.trim().toLowerCase();
  let f=allSounds;
  if(activePan!=='all')f=f.filter(s=>s.pantheon===activePan);
  if(q)f=f.filter(s=>s.name.toLowerCase().includes(q)||s.file.toLowerCase().includes(q));
  const main=document.getElementById('main');
  if(!f.length){main.innerHTML=`<div class="grid-section"><div class="sound-grid"><div class="status-msg">No sounds found</div></div></div>`;return;}
  const groups={};f.forEach(s=>{if(!groups[s.pantheon])groups[s.pantheon]=[];groups[s.pantheon].push(s);});
  main.innerHTML='';
  Object.entries(groups).sort().forEach(([pan,sounds])=>{
    const sec=document.createElement('div');sec.className='grid-section';
    sec.innerHTML=`<div class="section-head"><span class="name">${pan}</span><span class="line"></span><span class="cnt">${sounds.length} sounds</span></div><div class="sound-grid" id="g-${pan}"></div>`;
    main.appendChild(sec);
    const grid=sec.querySelector(`#g-${pan}`);
    sounds.forEach(s=>grid.appendChild(mkBtn(s)));
  });
}

function mkBtn(sound){
  const btn=document.createElement('button');
  btn.className='snd-btn';btn.title=sound.file;
  btn.innerHTML=`<svg class="snd-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg><span class="snd-name">${sound.name}</span>`;
  btn.addEventListener('click',e=>{
    playSound(sound,btn);
    const r=document.createElement('span');r.className='ripple';
    const rect=btn.getBoundingClientRect(),sz=Math.max(rect.width,rect.height)*1.5;
    r.style.cssText=`width:${sz}px;height:${sz}px;left:${e.clientX-rect.left-sz/2}px;top:${e.clientY-rect.top-sz/2}px`;
    btn.appendChild(r);r.addEventListener('animationend',()=>r.remove());
  });
  return btn;
}

function playSound(sound,btn){
  if(currentAudio&&!currentAudio.paused){
    currentAudio.pause();currentAudio.currentTime=0;
    if(currentBtn){currentBtn.classList.remove('playing');setIcon(currentBtn,false);}
    if(currentBtn===btn){currentAudio=null;currentBtn=null;hideNP();return;}
  }
  const a=new Audio(sound.url);a.volume=volume;
  a.play().catch(e=>console.warn(e));
  currentAudio=a;currentBtn=btn;
  btn.classList.add('playing');setIcon(btn,true);showNP(sound.name);
  a.addEventListener('ended',()=>{btn.classList.remove('playing');setIcon(btn,false);currentAudio=null;currentBtn=null;hideNP();});
}

function setIcon(btn,playing){
  btn.querySelector('.snd-icon').innerHTML=playing
    ?`<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>`
    :`<polygon points="5 3 19 12 5 21 5 3"/>`;
}

function stopAll(){
  if(currentAudio){currentAudio.pause();currentAudio.currentTime=0;}
  if(currentBtn){currentBtn.classList.remove('playing');setIcon(currentBtn,false);}
  currentAudio=null;currentBtn=null;hideNP();
}

function showNP(name){document.getElementById('npName').textContent=name;document.getElementById('nowPlaying').classList.add('visible');}
function hideNP(){document.getElementById('nowPlaying').classList.remove('visible');}
function showLoading(msg){document.getElementById('main').innerHTML=`<div class="grid-section"><div class="sound-grid"><div class="status-msg"><div class="loader"></div><br>${msg}</div></div></div>`;}
</script>
</body>
</html>
