<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MCL Control</title>
<meta name="robots" content="noindex">
<link rel="icon" href="Logos/DeitiesofDeath2.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* MCL Control — DoD admin for the Mythic Clan League. Dark, dense, one red. */
:root {
  --bg: #0b0b0b; --bg-deep: #070707; --surface: #141414; --surface-2: #1c1c1c; --line: #2a2a2a; --line-strong: #3a3a3a;
  --text: #f5f5f5; --muted: #a3a3a3; --dim: #7a7a7a; --red: #c0392b; --red-hover: #a8281c; --red-text: #e04a3b;
  --ok: #2ecc71; --warn: #e0ad4a;
  --display: 'Barlow Condensed', 'Arial Narrow', system-ui, sans-serif; --body: 'Barlow', system-ui, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 400 15px/1.5 var(--body); -webkit-font-smoothing: antialiased; }
a { color: var(--text); }
a:hover { color: var(--red-text); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--red-text); outline-offset: 2px; }
[hidden] { display: none !important; }

.top { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: 10px 24px; background: rgba(11,11,11,0.94); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
.brand img { width: 30px; height: 30px; object-fit: contain; }
.brand b { font-family: var(--display); font-size: 22px; font-weight: 700; letter-spacing: 0.01em; }
.brand span { color: var(--muted); font-size: 13px; }
.pill { display: inline-flex; align-items: center; gap: 8px; padding: 4px 10px; border: 1px solid var(--line); font-size: 13px; color: var(--muted); white-space: nowrap; }
.pill i { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); }
.pill.ok i { background: var(--ok); } .pill.busy i { background: var(--warn); } .pill.err { color: var(--red-text); border-color: var(--red); } .pill.err i { background: var(--red-text); }
.user { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }

.tabs { display: flex; gap: 0; padding: 0 24px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.tabs button { all: unset; cursor: pointer; padding: 14px 16px; font-family: var(--display); font-weight: 600; font-size: 18px; color: var(--muted); border-bottom: 3px solid transparent; white-space: nowrap; }
.tabs button:hover { color: var(--text); }
.tabs button[aria-selected='true'] { color: var(--text); border-bottom-color: var(--red); }
.tabs button .n { font-family: var(--body); font-size: 12px; color: var(--dim); margin-left: 6px; }

main { max-width: 1320px; margin: 0 auto; padding: 28px 24px 96px; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; margin: 0; line-height: 1.05; }
h1 { font-size: 40px; } h2 { font-size: 28px; } h3 { font-size: 20px; }
.lead { color: var(--muted); max-width: 70ch; margin: 6px 0 0; }
.muted { color: var(--muted); } .dim { color: var(--dim); font-size: 13px; }
.row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: var(--gap, 16px); }
.head { display: flex; justify-content: space-between; align-items: end; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
.grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(min(100%, var(--min, 300px)), 1fr)); }
.card { background: var(--surface); border: 1px solid var(--line); padding: 20px; }
.card.tight { padding: 0; }

.btn { all: unset; box-sizing: border-box; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 0 16px; border: 1px solid var(--line-strong); font-weight: 600; font-size: 14px; white-space: nowrap; }
.btn:hover { border-color: var(--text); }
.btn.primary { background: var(--red); border-color: var(--red); color: #fff; }
.btn.primary:hover { background: var(--red-hover); }
.btn.sm { min-height: 32px; padding: 0 10px; font-size: 13px; }
.btn.ghost { border-color: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--text); border-color: var(--line-strong); }
.btn.danger:hover { border-color: var(--red); color: var(--red-text); }
.btn:focus-visible { outline: 2px solid var(--red-text); outline-offset: 2px; }

label.f { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: var(--muted); }
input[type=text], input[type=url], input[type=number], input[type=datetime-local], select, textarea {
  background: var(--bg); border: 1px solid var(--line-strong); padding: 8px 10px; min-height: 38px; width: 100%; font-size: 14px; }
input:focus, select:focus, textarea:focus { border-color: var(--red-text); outline: none; }
textarea { min-height: 160px; resize: vertical; font-family: ui-monospace, Consolas, monospace; font-size: 13px; }
input.score { width: 52px; text-align: center; font-family: var(--display); font-weight: 700; font-size: 20px; padding: 4px; min-height: 36px; -moz-appearance: textfield; }
input.score::-webkit-inner-spin-button { -webkit-appearance: none; }

table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--dim); font-weight: 600; padding: 10px 12px; border-bottom: 1px solid var(--line); }
td { padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
.num { text-align: center; font-variant-numeric: tabular-nums; }
.scroll { overflow-x: auto; }

.logo { width: 24px; height: 24px; object-fit: contain; flex: none; }
.team { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; }
.tag { display: inline-block; font-size: 12px; font-weight: 600; padding: 1px 8px; border: 1px solid var(--line-strong); color: var(--muted); }
.tag.red { border-color: var(--red); color: var(--red-text); }
.tag.ok { border-color: #1f6b41; color: var(--ok); }
.code { font-family: ui-monospace, Consolas, monospace; letter-spacing: 0.1em; }

/* Checklist */
.steps { counter-reset: s; display: grid; gap: 1px; background: var(--line); border: 1px solid var(--line); }
.step { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 16px; align-items: center; padding: 16px 20px; background: var(--surface); }
.step::before { counter-increment: s; content: counter(s); font-family: var(--display); font-weight: 700; font-size: 26px; color: var(--dim); }
.step.done::before { content: '✓'; color: var(--ok); }
.step b { display: block; font-size: 16px; }

/* Groups board */
.gcol { background: var(--surface); border: 1px solid var(--line); display: flex; flex-direction: column; }
.gcol header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.gcol ol { list-style: none; margin: 0; padding: 6px; display: flex; flex-direction: column; gap: 4px; min-height: 60px; }
.gcol li { display: flex; align-items: center; gap: 8px; padding: 6px 8px; background: var(--surface-2); }
.gcol li .team { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gcol li select { width: auto; min-height: 30px; padding: 2px 6px; font-size: 13px; }
.unassigned { border-style: dashed; }
.qual td:first-child { box-shadow: inset 3px 0 0 var(--red); }

/* Fixtures */
.fx { display: grid; grid-template-columns: 84px minmax(0, 1fr) auto minmax(0, 1fr) minmax(160px, 260px); gap: 12px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); }
.fx:last-child { border-bottom: 0; }
.fx .r { justify-self: end; }
.fx .vs { display: flex; align-items: center; gap: 6px; }
.fx.done { background: rgba(46, 204, 113, 0.03); }
.fx .won { color: var(--text); } .fx .lost { color: var(--dim); font-weight: 500; }
@media (max-width: 860px) { .fx { grid-template-columns: 1fr auto 1fr; } .fx > :first-child, .fx > :last-child { grid-column: 1 / -1; } .fx .r { justify-self: start; } }

/* Bracket */
.bsec { margin-bottom: 28px; }
.bsec > h3 { margin-bottom: 12px; color: var(--muted); font-size: 16px; text-transform: uppercase; letter-spacing: 0.08em; }
.bracket { display: flex; gap: 20px; overflow-x: auto; padding-bottom: 8px; }
.bround { display: flex; flex-direction: column; justify-content: space-around; gap: 12px; min-width: 215px; }
.bround > .dim { text-align: center; font-weight: 600; }
.bm { background: var(--surface); border: 1px solid var(--line); }
.bm .id { display: flex; justify-content: space-between; padding: 4px 10px; font-size: 11px; color: var(--dim); border-bottom: 1px solid var(--line); }
.bm .side { display: flex; align-items: center; gap: 8px; padding: 6px 8px 6px 10px; }
.bm .side + .side { border-top: 1px solid var(--line); }
.bm .side .team { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; }
.bm .side.win { box-shadow: inset 3px 0 0 var(--red); }
.bm .side.win .team { color: var(--text); }
.bm .side.lose .team { color: var(--dim); }
.bm .seed { width: 18px; font-size: 12px; color: var(--dim); text-align: right; }
.bm .vod { padding: 6px 8px; border-top: 1px solid var(--line); }
.bm .vod input { min-height: 28px; font-size: 12px; padding: 4px 8px; }
.bm.tbd { opacity: 0.55; }
.bm.gf { border-color: var(--red); }

/* Drawer */
dialog { background: var(--surface); color: var(--text); border: 1px solid var(--line-strong); padding: 0; width: min(760px, calc(100vw - 32px)); max-height: calc(100vh - 48px); }
dialog::backdrop { background: rgba(0,0,0,0.7); }
dialog header, dialog footer { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
dialog footer { border-top: 1px solid var(--line); border-bottom: 0; }
dialog .body { padding: 20px; overflow: auto; max-height: calc(100vh - 200px); }
.prow { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1.6fr) 110px 90px 36px; gap: 8px; margin-bottom: 8px; align-items: center; }

/* Sign-in */
.gate { min-height: 70vh; display: grid; place-items: center; text-align: center; }
.gate .card { max-width: 520px; padding: 40px; display: flex; flex-direction: column; gap: 16px; align-items: center; }
.gate img { width: 120px; }
.notice { border: 1px solid var(--warn); background: rgba(224,173,74,0.06); padding: 16px 20px; margin-bottom: 20px; }
.notice.err { border-color: var(--red); background: rgba(192,57,43,0.08); }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--surface-2); border: 1px solid var(--line-strong); padding: 10px 18px; font-weight: 600; z-index: 50; }
</style>
</head>
<body>
<div class="top">
  <div class="brand"><img src="Logos/DeitiesofDeath2.png" alt=""><b>MCL Control</b><span id="season-label"></span></div>
  <span class="pill" id="save-pill"><i></i><span>Connecting…</span></span>
  <a class="btn sm" id="public-link" target="_blank" rel="noopener">Open public bracket ↗</a>
  <div class="user" id="user"></div>
</div>
<nav class="tabs" id="tabs" role="tablist" hidden></nav>
<main id="main"><div class="gate"><p class="muted">Loading…</p></div></main>
<dialog id="dlg"></dialog>
<div class="toast" id="toast" hidden></div>
<script type="module" src="mcl/mcl-admin.js"></script>
</body>
</html>
